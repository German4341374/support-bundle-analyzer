name: Bug report
description: Report reproducible incorrect behavior using synthetic data only
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Do not attach real support bundles, secrets, personal data, or customer identifiers. Security issues must use private vulnerability reporting."
  - type: input
    id: version
    attributes: {label: Version or commit, placeholder: "0.1.0 or commit SHA"}
    validations: {required: true}
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Go core, TypeScript API, Static report, Python plugin, Windows plugin, JVM plugin, PHP plugin, PostgreSQL, Docker, Helm, Terraform, Documentation]
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Synthetic reproduction, description: "Provide commands and a minimal fictional fixture."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior and safe error output}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I verified that this report contains no secrets, customer data, or personal information.
          required: true
