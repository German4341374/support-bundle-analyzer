name: Documentation improvement
description: Report an inaccurate command, missing explanation, or unclear guide.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
