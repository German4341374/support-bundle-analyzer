version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, go]
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, typescript]
  - package-ecosystem: pip
    directory: /analyzers/log-intelligence-python
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: nuget
    directory: /analyzers/windows-diagnostics-analyzer
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, dotnet]
  - package-ecosystem: maven
    directory: /analyzers/jvm-diagnostics-analyzer
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, java]
  - package-ecosystem: composer
    directory: /analyzers/php-web-diagnostics-analyzer
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, php]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
