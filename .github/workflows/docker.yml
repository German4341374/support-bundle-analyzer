name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dockerfile-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  build-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: support-bundle-analyzer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container health smoke test
        run: |
          docker run -d --rm --name sba-smoke -p 127.0.0.1:18080:8080 \
            -e SBA_ACCESS_TOKEN=synthetic-ci-token-1234567890 \
            support-bundle-analyzer:${{ github.sha }}
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:18080/health && break || sleep 1; done
          curl --fail http://127.0.0.1:18080/health
          docker stop sba-smoke
      - name: Scan image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: support-bundle-analyzer:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: support-bundle-analyzer:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  compose-health:
    runs-on: ubuntu-24.04
    env:
      SBA_ACCESS_TOKEN: synthetic-compose-token-1234567890
      POSTGRES_DB: support_bundle_analyzer
      POSTGRES_USER: sba_ci
      POSTGRES_PASSWORD: synthetic-compose-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start the local stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify public health endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ready
      - name: Capture diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
