name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build synthetic documentation site
        run: |
          mkdir -p site
          cp docs/site/index.html docs/site/comparison.html docs/site/sitemap.xml docs/site/robots.txt site/
          go build -trimpath -o .tmp-support-bundle-analyzer ./apps/cli
          ./.tmp-support-bundle-analyzer generate-demo .tmp-pages-demo.zip
          ./.tmp-support-bundle-analyzer generate-demo .tmp-pages-healthy.zip --scenario healthy
          ./.tmp-support-bundle-analyzer analyze .tmp-pages-demo.zip --output .tmp-pages-outage-workspace --timezone UTC --quiet
          ./.tmp-support-bundle-analyzer analyze .tmp-pages-healthy.zip --output .tmp-pages-healthy-workspace --timezone UTC --quiet
          ./.tmp-support-bundle-analyzer diff .tmp-pages-healthy-workspace .tmp-pages-outage-workspace --output site/comparison.json
          cp -R .tmp-pages-outage-workspace/report site/demo-report
          cp -R .tmp-pages-healthy-workspace/report site/healthy-report
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
