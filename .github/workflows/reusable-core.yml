name: Reusable core verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l apps internal)"
      - name: Vet
        run: go vet ./apps/... ./internal/...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./apps/... ./internal/...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage-go.out ./apps/... ./internal/...
      - name: Build CLI
        run: go build -trimpath -o bin/support-bundle-analyzer ./apps/cli
      - name: Upload Go evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-core-${{ github.sha }}
          path: |
            bin/support-bundle-analyzer
            coverage-go.out
          retention-days: 14
