name: support-bundle-analyzer

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SBA_ACCESS_TOKEN: ${SBA_ACCESS_TOKEN:?Set SBA_ACCESS_TOKEN in .env}
      SBA_ANALYSIS_TIMEOUT_SECONDS: ${SBA_ANALYSIS_TIMEOUT_SECONDS:-900}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - analysis-data:/data/workspaces
      - ./fixtures:/input:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    networks: [backend, frontend]

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=2775
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.up.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed/development.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [backend]

volumes:
  analysis-data:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
