apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sba.name" . }}
  labels:
    {{- include "sba.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sba.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sba.name" . }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SBA_HOST
              value: 0.0.0.0
            - name: SBA_ALLOW_REMOTE
              value: "true"
            - name: SBA_ANALYSIS_TIMEOUT_SECONDS
              value: {{ .Values.analysisTimeoutSeconds | quote }}
            - name: SBA_RATE_LIMIT_MAX
              value: {{ .Values.rateLimit.max | quote }}
            - name: SBA_EXPENSIVE_RATE_LIMIT_MAX
              value: {{ .Values.rateLimit.expensiveMax | quote }}
            - name: SBA_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.tokenKey }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspaces
              mountPath: /data/workspaces
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspaces
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sba.name" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
